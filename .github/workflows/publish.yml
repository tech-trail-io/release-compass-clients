name: Publish

# Stage-only release (npm trusted publishing + provenance).
#
# On npmjs.com for each @techtrail/release-compass-* package:
#   Settings → Trusted Publisher → GitHub Actions
#     Organization: tech-trail-io
#     Repository: release-compass-clients
#     Workflow filename: publish.yml   ← filename only
#     Environment name: npm
#     Allowed actions: npm stage publish ONLY (do not allow npm publish)
#   Settings → Publishing access → Require 2FA and disallow tokens
#
# CI uploads a stage (not live). A maintainer then:
#   npm stage list
#   npm stage approve <stage-id> --otp <code>
#
# Optional bootstrap (first package create only): a short-lived granular
# access token with Read and write (stage only) for @techtrail scope.
# Prefer OIDC after packages exist — see README "Releasing".

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Pack and dry-run stage publish without uploading"
        type: boolean
        default: true

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --filter @techtrail/release-compass-core build
      - run: pnpm typecheck
      - run: pnpm test

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm build

      - name: Upload package artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-dist
          path: |
            packages/core/dist/**
            packages/react/dist/**
            packages/next/dist/**
            packages/angular/dist/**
          retention-days: 1
          if-no-files-found: error

  stage:
    name: Stage on npm (OIDC)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: build
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Ensure npm CLI supports stage publish
        run: npm install -g npm@latest && npm --version

      - name: Download package artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package-dist
          path: packages

      - name: Align package versions with tag
        if: github.event_name == 'push'
        run: bash .github/scripts/set-version-from-tag.sh "${GITHUB_REF_NAME}"

      - name: Stage packages (OIDC + provenance)
        env:
          # Optional bootstrap / fallback: secrets.NPM_STAGE_TOKEN
# (granular access token, Read and write → stage only, @techtrail scope).
# Prefer Trusted Publisher OIDC once packages exist; remove the secret after.
NODE_AUTH_TOKEN: ${{ secrets.NPM_STAGE_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
        run: |
          set -euo pipefail
          dry="${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}"
          packages=(
            packages/core
            packages/react
            packages/angular
            packages/next
          )
          for dir in "${packages[@]}"; do
            echo "::group::${dir}"
            if [ "$dry" = "true" ]; then
              (cd "$dir" && npm stage publish --access public --dry-run)
            else
              (cd "$dir" && npm stage publish --access public)
            fi
            echo "::endgroup::"
          done
          if [ "$dry" != "true" ]; then
            echo
            echo "Staged. On a trusted machine with org 2FA:"
            echo "  npm stage list"
            echo "  npm stage approve <stage-id> --otp <code>"
          fi
