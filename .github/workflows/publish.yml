name: Publish

# Release with provenance. New package names use `npm publish` once; later
# versions use `npm stage publish` (maintainer approves with 2FA).
#
# Auth (prefer OIDC after packages exist):
#   Trusted Publisher per package → GitHub tech-trail-io/release-compass-clients
#     workflow: publish.yml · environment: npm
#     Allowed actions: both npm publish AND npm stage publish until bootstrap
#     is done, then restrict to stage-only if you want.
#   Fallback secret NPM_STAGE_TOKEN: granular token for @techtrail.
#     First create needs Read and write (publish and stage), not stage-only.
#     After packages exist you can switch the token (or OIDC) to stage-only.
#
# Approve staged versions locally:
#   npm stage list
#   npm stage approve <stage-id> --otp <code>

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Pack and dry-run without uploading"
        type: boolean
        default: true

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --filter @techtrail/release-compass-core build
      - run: pnpm typecheck
      - run: pnpm test

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm build

      - name: Upload package artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-dist
          path: |
            packages/core/dist/**
            packages/react/dist/**
            packages/next/dist/**
            packages/angular/dist/**
          retention-days: 1
          if-no-files-found: error

  publish:
    name: Publish or stage on npm
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: build
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Ensure npm CLI supports stage publish
        run: npm install -g npm@latest && npm --version

      - name: Download package artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package-dist
          path: packages

      - name: Align package versions with tag
        if: github.event_name == 'push'
        run: bash .github/scripts/set-version-from-tag.sh "${GITHUB_REF_NAME}"

      - name: Publish new packages / stage existing
        env:
          # Fallback when Trusted Publisher OIDC is not configured yet.
          # First create of a package name needs publish rights (not stage-only).
          NODE_AUTH_TOKEN: ${{ secrets.NPM_STAGE_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
        run: |
          set -euo pipefail
          chmod +x .github/scripts/publish-or-stage.sh
          dry="${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}"
          for dir in packages/core packages/react packages/angular packages/next; do
            echo "::group::${dir}"
            bash .github/scripts/publish-or-stage.sh "$dir" "$dry"
            echo "::endgroup::"
          done
